<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#133197">
<title>Due Desk · FAST NUCES</title>
<link rel="icon" href="/fast-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="#/" class="brand" aria-label="Due Desk home">
      <span class="logo-wrap"><img src="/fast-logo.png" alt="" width="36" height="36"></span>
      <span class="brand-text"><strong>Due Desk</strong><small>FAST NUCES Lahore</small></span>
    </a>
    <div class="topbar-right">
      <span class="presence" id="presence" title="People viewing right now"><span class="dot"></span><span id="presence-count">1</span><span class="presence-word"> online</span></span>
      <button type="button" class="me-btn" id="me-btn" aria-label="Change your name"></button>
    </div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-tab="home">Deadlines</a>
    <a href="#/projects" data-tab="projects">Group projects</a>
  </nav>
</header>

<main id="view" class="container" aria-live="polite"></main>

<button type="button" class="fab" id="fab"><span class="fab-plus" aria-hidden="true">+</span><span class="fab-label" id="fab-label">Add deadline</span></button>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- Name -->
<dialog id="dlg-name" class="sheet">
  <form method="dialog" id="form-name" class="sheet-body">
    <h2>Assalam-o-alaikum!</h2>
    <p class="muted">What should your classmates see when you post?</p>
    <label class="field"><span>Your name</span><input name="name" required maxlength="40" autocomplete="given-name" placeholder="e.g. Ali"></label>
    <div class="sheet-actions"><button type="submit" class="btn primary">Continue</button></div>
  </form>
</dialog>

<!-- Add deadline -->
<dialog id="dlg-deadline" class="sheet">
  <form id="form-deadline" class="sheet-body">
    <div class="sheet-head"><h2>Add a deadline</h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div>
    <label class="field"><span>Title</span><input name="title" required maxlength="120" placeholder="e.g. Quiz 3: Trees and heaps"></label>
    <label class="field"><span>Course</span><input name="course" required maxlength="80" list="course-list" placeholder="e.g. Data Structures"></label>
    <datalist id="course-list"></datalist>
    <fieldset class="field">
      <legend>Type</legend>
      <div class="seg">
        <label><input type="radio" name="type" value="Quiz" checked><span>Quiz</span></label>
        <label><input type="radio" name="type" value="Assignment"><span>Assignment</span></label>
        <label><input type="radio" name="type" value="Project"><span>Project</span></label>
        <label><input type="radio" name="type" value="Exam"><span>Exam</span></label>
      </div>
    </fieldset>
    <label class="field"><span>Due</span><input name="due_at" type="datetime-local" required></label>
    <label class="field"><span>Notes <em>(optional)</em></span><textarea name="notes" rows="2" maxlength="500" placeholder="Syllabus, room, submission link…"></textarea></label>
    <p class="form-error" hidden></p>
    <div class="sheet-actions"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Post to everyone</button></div>
  </form>
</dialog>

<!-- New project -->
<dialog id="dlg-project" class="sheet">
  <form id="form-project" class="sheet-body">
    <div class="sheet-head"><h2>New group project</h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div>
    <label class="field"><span>Project title</span><input name="title" required maxlength="120" placeholder="e.g. Library management system"></label>
    <label class="field"><span>Course</span><input name="course" maxlength="80" list="course-list" placeholder="e.g. Software Engineering"></label>
    <label class="field"><span>Due</span><input name="due_at" type="datetime-local"></label>
    <label class="field"><span>What do you have to build?</span><textarea name="description" rows="3" maxlength="1000" placeholder="Paste the project brief. The AI uses this to suggest tasks."></textarea></label>
    <div class="field">
      <label for="member-input">Group members</label>
      <div class="chips-input" id="member-chips"><input id="member-input" placeholder="Type a name, press Enter" maxlength="40"></div>
      <small class="muted">You're added automatically.</small>
    </div>
    <p class="form-error" hidden></p>
    <div class="sheet-actions"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Create project</button></div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
